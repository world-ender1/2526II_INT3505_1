openapi: 3.0.0
info:
  title: Library Management API
  version: 0.0.0
tags: []
paths:
  /books:
    get:
      operationId: Books_list
      summary: Get all books
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      operationId: Books_create
      summary: Add a new book
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
  /books/{id}:
    get:
      operationId: Books_read
      summary: Get a book by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - author
      properties:
        id:
          type: integer
          format: int32
          example: 101
        title:
          type: string
          example: The Lord of the Rings
        author:
          type: string
          example: J.R.R. Tolkien
        publishedYear:
          type: integer
          format: int32
          example: 1954
    BookInput:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          example: The Lord of the Rings
        author:
          type: string
          example: J.R.R. Tolkien
        publishedYear:
          type: integer
          format: int32
          example: 1954
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
servers:
  - url: http://api.library.local/v1
    description: Local Server
    variables: {}
